<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DSA Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap');
:root {
–blur: blur(40px) saturate(180%);
–blur-sm: blur(20px) saturate(160%);
–radius-xl: 28px;
–radius-lg: 20px;
–radius-md: 14px;
–radius-sm: 10px;
–blue: #0A84FF;
–green: #30D158;
–indigo: #5E5CE6;
–pink: #FF375F;
–yellow: #FFD60A;
–orange: #FF9F0A;
–teal: #5AC8FA;
–bg-primary: rgba(255,255,255,0.72);
–bg-secondary: rgba(255,255,255,0.55);
–border: rgba(255,255,255,0.65);
–border-subtle: rgba(0,0,0,0.06);
–text-primary: #1C1C1E;
–text-secondary: #3C3C43;
–text-tertiary: rgba(60,60,67,0.6);
–text-quaternary: rgba(60,60,67,0.28);
–shadow-sm: 0 2px 8px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
–shadow-md: 0 8px 32px rgba(0,0,0,0.11), 0 2px 8px rgba(0,0,0,0.05);
–shadow-lg: 0 20px 60px rgba(0,0,0,0.14), 0 4px 16px rgba(0,0,0,0.07);
}
- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
font-family: ‘Inter’, -apple-system, BlinkMacSystemFont, sans-serif;
min-height: 100vh;
background: #F2F2F7;
background-attachment: fixed;
overflow-x: hidden;
padding-bottom: calc(env(safe-area-inset-bottom) + 90px);
}
.app {
max-width: 430px;
margin: 0 auto;
}
/* ── Header ── */
.header {
padding: 56px 20px 20px;
}
.header-inner {
display: flex;
align-items: flex-start;
justify-content: space-between;
margin-bottom: 6px;
}
.header-titles h1 {
font-size: 34px;
font-weight: 800;
letter-spacing: -0.8px;
color: var(–text-primary);
line-height: 1.05;
}
.header-titles p {
font-size: 13px;
color: var(–text-tertiary);
margin-top: 4px;
font-weight: 500;
}
.app-icon {
width: 52px; height: 52px;
background: linear-gradient(145deg, #1A73E8, #5E5CE6);
border-radius: 14px;
display: flex; align-items: center; justify-content: center;
font-size: 26px;
box-shadow: 0 6px 20px rgba(30,100,255,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
}
/* ── Progress Card ── */
.progress-card {
margin: 0 16px 16px;
background: var(–bg-primary);
backdrop-filter: var(–blur);
-webkit-backdrop-filter: var(–blur);
border-radius: var(–radius-xl);
border: 1px solid var(–border);
padding: 18px 20px;
box-shadow: var(–shadow-md), inset 0 1px 0 rgba(255,255,255,0.8);
}
.progress-top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
}
.progress-top span {
font-size: 12px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.6px;
color: var(–text-tertiary);
}
.progress-pct {
font-size: 13px !important;
font-weight: 700 !important;
color: var(–blue) !important;
letter-spacing: 0 !important;
text-transform: none !important;
}
.track {
height: 8px;
background: rgba(0,0,0,0.07);
border-radius: 999px;
overflow: hidden;
margin-bottom: 14px;
}
.fill {
height: 100%;
background: linear-gradient(90deg, var(–blue), var(–indigo));
border-radius: 999px;
transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
box-shadow: 0 0 10px rgba(10,132,255,0.35);
}
.stats {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 8px;
}
.stat {
background: rgba(0,0,0,0.04);
border-radius: 12px;
padding: 9px 8px;
text-align: center;
}
.stat-n {
font-size: 22px;
font-weight: 800;
color: var(–text-primary);
line-height: 1;
letter-spacing: -0.5px;
}
.stat-l {
font-size: 10px;
color: var(–text-tertiary);
margin-top: 2px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.4px;
}
/* ── Tabs ── */
.tabs-scroll {
padding: 0 16px 14px;
overflow-x: auto;
scrollbar-width: none;
}
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs {
display: flex;
gap: 7px;
width: max-content;
}
.tab {
font-size: 13px;
font-weight: 600;
padding: 8px 15px;
border-radius: 999px;
border: 1px solid var(–border);
cursor: pointer;
transition: all 0.28s cubic-bezier(0.34,1.56,0.64,1);
white-space: nowrap;
background: var(–bg-secondary);
backdrop-filter: var(–blur-sm);
-webkit-backdrop-filter: var(–blur-sm);
color: var(–text-secondary);
box-shadow: var(–shadow-sm);
font-family: inherit;
}
.tab.active {
background: var(–text-primary);
color: #fff;
border-color: transparent;
box-shadow: var(–shadow-md);
transform: scale(1.04);
}
/* ── Sections ── */
.section { display: none; padding: 0 16px; }
.section.active { display: block; }
/* ── Pattern Group ── */
.pg {
margin-bottom: 10px;
background: var(–bg-primary);
backdrop-filter: var(–blur);
-webkit-backdrop-filter: var(–blur);
border-radius: var(–radius-xl);
border: 1px solid var(–border);
overflow: hidden;
box-shadow: var(–shadow-sm), inset 0 1px 0 rgba(255,255,255,0.7);
animation: su 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes su {
from { opacity:0; transform:translateY(18px); }
to   { opacity:1; transform:translateY(0); }
}
.pg:nth-child(1){animation-delay:.04s}
.pg:nth-child(2){animation-delay:.09s}
.pg:nth-child(3){animation-delay:.14s}
.pg:nth-child(4){animation-delay:.19s}
.pg:nth-child(5){animation-delay:.24s}
.pg:nth-child(6){animation-delay:.29s}
.pg:nth-child(7){animation-delay:.34s}
.pg:nth-child(8){animation-delay:.39s}
.ph {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 16px;
cursor: pointer;
user-select: none;
-webkit-user-select: none;
}
.ph-icon {
width: 34px; height: 34px;
border-radius: 10px;
display: flex; align-items: center; justify-content: center;
font-size: 17px;
flex-shrink: 0;
}
.ph-info { flex: 1; min-width: 0; }
.ph-name {
font-size: 15px;
font-weight: 600;
color: var(–text-primary);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.ph-sub {
font-size: 12px;
color: var(–text-tertiary);
margin-top: 1px;
font-weight: 500;
}
.chevron {
color: var(–text-quaternary);
transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
flex-shrink: 0;
}
.pg.open .chevron { transform: rotate(90deg); }
/* mini progress bar */
.mini-track {
height: 3px;
background: rgba(0,0,0,0.06);
margin: 0 16px 10px;
border-radius: 999px;
overflow: hidden;
}
.mini-fill {
height: 100%;
border-radius: 999px;
transition: width 0.4s ease;
}
/* Problems */
.problems {
display: none;
border-top: 1px solid var(–border-subtle);
}
.pg.open .problems { display: block; }
.prob {
display: flex;
align-items: center;
gap: 13px;
padding: 12px 16px;
cursor: pointer;
transition: background 0.14s;
border-bottom: 1px solid var(–border-subtle);
}
.prob:last-child { border-bottom: none; }
.prob:active { background: rgba(0,0,0,0.04); }
/* Checkbox */
.cb {
width: 23px; height: 23px;
border-radius: 50%;
border: 2px solid rgba(0,0,0,0.14);
background: rgba(255,255,255,0.5);
flex-shrink: 0;
display: flex; align-items: center; justify-content: center;
transition: all 0.26s cubic-bezier(0.34,1.56,0.64,1);
}
.cb.on {
background: var(–green);
border-color: var(–green);
box-shadow: 0 2px 10px rgba(48,209,88,0.45);
transform: scale(1.08);
}
.cb.on::after {
content: ‘’;
display: block;
width: 6px; height: 10px;
border: 2px solid #fff;
border-top: none;
border-left: none;
transform: rotate(45deg) translate(-0.5px,-1px);
}
.prob-lbl {
flex: 1;
font-size: 15px;
color: var(–text-primary);
line-height: 1.3;
transition: color 0.2s;
}
.prob.done .prob-lbl {
color: var(–text-quaternary);
text-decoration: line-through;
}
.prob-idx {
font-size: 11px;
color: var(–text-quaternary);
font-weight: 600;
flex-shrink: 0;
}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="header-inner">
<div class="header-titles">
<h1>DSA Tracker</h1>
<p>Harsha . Consistency</p>
</div>
<div class="app-icon">🧠</div>
</div>
</div>
<div class="progress-card">
<div class="progress-top">
<span>Overall Progress</span>
<span class="progress-pct" id="pct">0%</span>
</div>
<div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
<div class="stats">
<div class="stat"><div class="stat-n" id="sDone">0</div><div class="stat-l">Solved</div></div>
<div class="stat"><div class="stat-n" id="sLeft">0</div><div class="stat-l">Left</div></div>
<div class="stat"><div class="stat-n" id="sTotal">0</div><div class="stat-l">Total</div></div>
</div>
</div>
<div class="tabs-scroll"><div class="tabs" id="tabs"></div></div>
<div id="sections"></div>
</div>
<script>
const ICONS=[['↔️','⏱️','↕️','∑','🔢'],['↔️','🪟','#️⃣','✏️','.*'],['🎯','📐','📦','🔢','🗻'],['🔁','⚔️','🌿','🔍'],['🐢','🪄','♻️','🔃'],['🏗️','📊','🧮','📚','🪟'],['🌿','🏗️','🪞','🛤️','🔎','✅'],['🏆','📊','🔀','🪟','🏗️','🔧','🕸️'],['💡','🏗️','📏','🎒','∑','🔢','✂️','🎲'],['🔗','🗺️','🔄','⚖️','🌲','🧭','🎨']];

 {bg:'rgba(94,92,230,0.13)',ic:'#5E5CE6',f:'linear-gradient(90deg,#5E5CE6,#BF5AF2)'},
 {bg:'rgba(255,159,10,0.13)',ic:'#FF9F0A',f:'linear-gradient(90deg,#FF9F0A,#FF6B00)'},
 {bg:'rgba(255,55,95,0.13)',ic:'#FF375F',f:'linear-gradient(90deg,#FF375F,#FF2D55)'},
 {bg:'rgba(90,200,250,0.13)',ic:'#5AC8FA',f:'linear-gradient(90deg,#5AC8FA,#32ADE6)'},

 {topic:"Arrays",patterns:[

   {name:"Range Search",probs:["Split Array Largest Sum","Find Kth Smallest Element in a Sorted Matrix","Capacity To Ship Packages Within D Days","Maximum Average Subarray I"]},

   {name:"Divide & Conquer",probs:["Binary Search","Merge Sort","Quick Sort","Maximum Subarray","Maximum Subarray"]},
   {name:"Backtracking",probs:["Generate Parentheses","Combination Sum","N-Queens","Letter Combinations of a Phone Number","Word Search"]},
   {name:"Recursive Search",probs:["Sudoku Solver","Number of Islands","Path Sum","Word Search II"]},
 ]},

let ck={};
try{ck=JSON.parse(localStorage.getItem('dsa_v3')||'{}');}catch(e){}
function save(){try{localStorage.setItem('dsa_v3',JSON.stringify(ck));}catch(e){}}
function updateGlobal(){
 let t=0,d=0;
 data.forEach((topic,ti)=>topic.patterns.forEach((pat,pi)=>pat.probs.forEach((_,qi)=>{t++;if(ck[`${ti}-${pi}-${qi}`])d++;})));
 const p=t?Math.round(d/t*100):0;
 document.getElementById('fill').style.width=p+'%';
 document.getElementById('pct').textContent=p+'%';
 document.getElementById('sDone').textContent=d;
 document.getElementById('sLeft').textContent=t-d;
 document.getElementById('sTotal').textContent=t;
}
function build(){
 const tabsEl=document.getElementById('tabs');
 const secsEl=document.getElementById('sections');
 data.forEach((topic,ti)=>{
   const tab=document.createElement('button');
   tab.className='tab'+(ti===0?' active':'');
   tab.textContent=topic.topic;
   tab.onclick=()=>{
     document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
     document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
     tab.classList.add('active');
     const sec=document.getElementById('s'+ti);
     sec.classList.add('active');
     sec.querySelectorAll('.pg').forEach((pg,i)=>{
       pg.style.animation='none';pg.offsetHeight;
       pg.style.animation=`su 0.45s cubic-bezier(0.34,1.56,0.64,1) ${i*0.05+0.02}s both`;
     });
   };
   tabsEl.appendChild(tab);
   const sec=document.createElement('div');
   sec.className='section'+(ti===0?' active':'');
sec.id='s'+ti;
   topic.patterns.forEach((pat,pi)=>{
     const c=CLRS[pi%CLRS.length];
     const icArr=ICONS[ti]||[];
     const ic=icArr[pi]||'📌';
     const total=pat.probs.length;
     const getDone=()=>pat.probs.filter((_,qi)=>ck[`${ti}-${pi}-${qi}`]).length;
     const pg=document.createElement('div');
     pg.className='pg';
     // Header
     const ph=document.createElement('div');
     ph.className='ph';
     ph.innerHTML=`
<div class="ph-icon" style="background:${c.bg};">${ic}</div>
<div class="ph-info">
<div class="ph-name">${pat.name}</div>
<div class="ph-sub" id="sub-${ti}-${pi}">${getDone()}/${total} completed</div>
</div>
<svg class="chevron" width="8" height="13" viewBox="0 0 8 13" fill="none">
<path d="M1 1.5l5.5 5L1 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
     ph.onclick=()=>pg.classList.toggle('open');
     // Mini bar
     const mt=document.createElement('div');mt.className='mini-track';
     const mf=document.createElement('div');mf.className='mini-fill';
     mf.style.background=c.f;
     mf.style.width=(total?getDone()/total*100:0)+'%';
     mt.appendChild(mf);
     // Problems
     const pl=document.createElement('div');pl.className='problems';
     pat.probs.forEach((name,qi)=>{
       const key=`${ti}-${pi}-${qi}`;
       const div=document.createElement('div');
       div.className='prob'+(ck[key]?' done':'');
       const cb=document.createElement('div');
       cb.className='cb'+(ck[key]?' on':'');
       const lbl=document.createElement('span');
       lbl.className='prob-lbl';lbl.textContent=name;
       const idx=document.createElement('span');
       idx.className='prob-idx';idx.textContent=`${qi+1}`;
       div.appendChild(cb);div.appendChild(lbl);div.appendChild(idx);
       div.onclick=()=>{
         ck[key]=!ck[key];
         const on=ck[key];
         cb.classList.toggle('on',on);
         div.classList.toggle('done',on);
         cb.style.transform='scale(1.35)';
         setTimeout(()=>{cb.style.transform='';},220);
         const d2=getDone();
         document.getElementById(`sub-${ti}-${pi}`).textContent=`${d2}/${total} completed`;
         mf.style.width=(total?d2/total*100:0)+'%';
         save();updateGlobal();
       };
       pl.appendChild(div);
     });
     pg.appendChild(ph);pg.appendChild(mt);pg.appendChild(pl);
     sec.appendChild(pg);
   });
   secsEl.appendChild(sec);
 });
 updateGlobal();
}
build();
</script>
</body>
</html>
